<!doctype html><html><head><meta charset="utf-8"><title>Icon options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--night:#14120F;--raised:#1E1B17;--chalk:#F4EFE6;--pencil:#B9B1A3;--graphite:#7A7266;--cobalt:#5B8CFF;--mint:#3FD39B;--coral:#FF6F59}
*{box-sizing:border-box;margin:0} body{background:#0b0a08}
.frame{position:relative;width:1920px;height:1080px;background:var(--night);background-image:radial-gradient(#332E27 1.5px,transparent 1.6px);background-size:48px 48px;font-family:Inter;color:var(--chalk);overflow:hidden}
.tag{position:absolute;left:56px;font:500 26px 'JetBrains Mono';color:var(--pencil)}
.node svg,.free svg{flex-shrink:0}
.node{position:absolute;height:140px;padding:0 40px;border:3px solid var(--graphite);background:var(--raised);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:20px;white-space:nowrap;font:600 44px Inter}
.node.active{border-color:var(--cobalt);box-shadow:0 0 12px rgba(91,140,255,.35)}
.free{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 44px Inter;white-space:nowrap}
.chip{position:absolute;font:700 34px Inter;color:var(--night);padding:4px 16px;border-radius:999px}
.rule{position:absolute;left:56px;right:56px;height:2px;background:#2A2621}
svg.wires{position:absolute;inset:0}
</style></head><body><div class="frame">
